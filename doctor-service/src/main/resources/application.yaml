server:
  port: 8082

spring:
  application:
    name: doctor-service

  # Kết nối PostgreSQL (Cần tạo sẵn DB doctor_db)
  datasource:
    url: jdbc:postgresql://localhost:5432/doctor_db
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update

# Đăng ký vào Eureka Server
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
