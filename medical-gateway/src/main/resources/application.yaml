server:
  port: 8080

spring:
  application:
    name: medical-gateway

  cloud:
    gateway:
      routes:
        # 1. Định tuyến cho Patient Service
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/v1/patients/**

        # 2. Định tuyến cho Doctor Service
        - id: doctor-service
          uri: lb://doctor-service
          predicates:
            - Path=/api/v1/doctors/**

        # 3. Định tuyến cho Appointment Service
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/appointments/**, /api/v1/appointment/**

# Đăng ký vào Eureka Server
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
